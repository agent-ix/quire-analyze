name: CI

on:
  workflow_dispatch:

jobs:
  rust:
    name: Complete Local Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install MSRV
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75.0

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Cargo policy and coverage tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-llvm-cov

      - name: Install specification tools and modules
        run: |
          npm install --global '@agent-ix/quire-cli@0.31.0' '@agent-ix/quoin@0.23.1' '@agent-ix/ix-flow@0.0.4'
          quoin module ensure-defaults

      - name: Run the complete local gate
        run: make ci
