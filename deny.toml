[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# First-party agent-ix crates are AGPL-3.0-or-later (owner decision 2026-09-14,
# agent-ix/quire-analyze#31). Exceptions are scoped to first-party crates so
# the third-party allow-list stays permissive-only.
exceptions = [
    { allow = ["AGPL-3.0-or-later"], crate = "quire-analyze" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-analyze-method-contract" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-canonical" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-canonical-derive" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-contract-model" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-exact" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-semantic-value" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-verification-contracts" },
    { allow = ["AGPL-3.0-or-later"], crate = "quire-walk" },
    { allow = ["AGPL-3.0-or-later"], crate = "ix-cli-kit" },
    { allow = ["AGPL-3.0-or-later"], crate = "ix-trace-rs" },
]

[bans]
multiple-versions = "allow"
wildcards = "warn"

[advisories]
version = 2
# RUSTSEC-2026-0009 affects only time's RFC 2822 parser. jsonschema 0.17.1 uses
# time solely for RFC 3339/date validation and contains no Rfc2822 reference;
# quire-analyze exposes only contract IR value types. The patched time release
# requires edition 2024/Rust 1.88, while this crate's contract is Rust 1.75.
# Keep the exact exception visible until agent-ix/quire-contract-ir#37 removes
# the dependency or raises the shared MSRV.
ignore = ["RUSTSEC-2026-0009"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/agent-ix/quire-canonical",
    "https://github.com/agent-ix/quire-contract-ir",
    "https://github.com/agent-ix/quire-exact",
    "https://github.com/agent-ix/quire-semantic-value",
    "https://github.com/agent-ix/quire-verification-contracts",
    "https://github.com/agent-ix/quire-walk",
    "https://github.com/agent-ix/ix-cli-kit",
    "https://github.com/agent-ix/ix-trace-rs",
]
