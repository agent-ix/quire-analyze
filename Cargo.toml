[package]
name = "quire-analyze"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "SMT-backed consistency and implication analysis for versioned requirement contracts."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/agent-ix/quire-analyze"

[lib]
name = "quire_analyze"
path = "src/lib.rs"

[dependencies]
quire-contract-ir = { git = "https://github.com/agent-ix/quire-contract-ir", rev = "bb5d30cbb1519b7ac286250114c96ba967661cba", version = "=0.1.0" }
sha2 = "=0.10.9"

[dev-dependencies]
serde_yaml = "=0.9.34"

[profile.release]
lto = "thin"
codegen-units = 1
